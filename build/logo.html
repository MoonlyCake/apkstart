<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { display: grid; width: 100vw; height: 100vh; place-items: center; }

  /* 主标：纯黑画布上的直角钢蓝方块 + 白色播放键 */
  .stage { position: relative; overflow: hidden; }
  .square-stage { display: grid; width: 1024px; height: 1024px; place-items: center; }
  .tile-mark { width: 896px; height: 896px; flex: none; }
  .tile-mark svg { display: block; width: 100%; height: 100%; }

  /* 横版 / 启动图里的缩放主标 */
  .scaled-tile { position: relative; overflow: hidden; flex: none; }
  .scaled-tile > .tile-mark { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .scaled-tile.wide-mark { width: 176px; height: 176px; }
  .scaled-tile.wide-mark > .tile-mark { transform: scale(0.196429); }   /* 176 / 896 */
  .scaled-tile.splash-mark { width: 236px; height: 236px; }
  .scaled-tile.splash-mark > .tile-mark { transform: scale(0.263393); } /* 236 / 896 */

  /* 宽磁贴 620x300（商店 310x150 的二倍） */
  .wide-stage { display: none; width: 620px; height: 300px; }
  .wide-tile {
    position: relative; width: 620px; height: 300px; overflow: hidden;
    background: #0b0c0d;
    display: flex; align-items: center; padding: 0 44px; gap: 34px;
  }
  .wide-rule { position: absolute; left: 44px; right: 44px; top: 58px; height: 1px; background: rgba(255,255,255,.14); }
  .wide-text { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
  .wide-name {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 34px; line-height: 1.15; letter-spacing: 1px;
    color: #f2f4f5;
  }
  .wide-sub {
    margin-top: 12px;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 20px; letter-spacing: .5px; color: #8a929b;
  }
  .wide-sub b { color: #8fb6d0; font-weight: 600; }

  /* 启动图 1240x600（商店 620x300 的二倍） */
  .splash-stage { display: none; width: 1240px; height: 600px; }
  .splash-tile {
    position: relative; width: 1240px; height: 600px; overflow: hidden;
    background: #0b0c0d;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px;
  }
  .splash-sub {
    position: relative; z-index: 2;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 28px; letter-spacing: 4px; color: #8a929b;
  }

  body.layout-square .square-stage { display: grid; }
  body.layout-wide .wide-stage { display: grid; place-items: center; }
  body.layout-splash .splash-stage { display: grid; place-items: center; }

  body:not(.layout-square) .square-stage,
  body:not(.layout-wide) .wide-stage,
  body:not(.layout-splash) .splash-stage { display: none; }
</style>
</head>
<body>
  <!-- 主标源：安装包 / 窗口 / 商店大磁贴；横版与启动图克隆它 -->
  <div class="stage square-stage">
    <div class="tile-mark" id="brand-tile">
      <svg viewBox="0 0 896 896" aria-label="Apk Start --Q">
        <defs>
          <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6E93B2"/>
            <stop offset="1" stop-color="#152238"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="896" height="896" fill="url(#markGrad)"/>
        <rect x="1.5" y="1.5" width="893" height="893" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="3"/>
        <path d="M364 286 648 448 364 610Z" fill="#ffffff"/>
      </svg>
    </div>
  </div>

  <div class="stage wide-stage">
    <div class="wide-tile">
      <div class="wide-rule"></div>
      <div class="scaled-tile wide-mark"></div>
      <div class="wide-text">
        <div class="wide-name">安卓应用运行器</div>
        <div class="wide-sub">双击 <b>APK</b>，即刻运行</div>
      </div>
    </div>
  </div>

  <div class="stage splash-stage">
    <div class="splash-tile">
      <div class="scaled-tile splash-mark"></div>
      <div class="splash-sub">双击 APK，即刻运行</div>
    </div>
  </div>

<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var layout = q.get('layout') || 'square';
    document.body.classList.add('layout-' + layout);
    // 横版 / 启动图复用主标 DOM，保证三处几何完全一致
    var src = document.getElementById('brand-tile');
    if (src) {
      document.querySelectorAll('.scaled-tile').forEach(function (host) {
        var clone = src.cloneNode(true);
        clone.removeAttribute('id');
        host.appendChild(clone);
      });
    }
  })();
</script>
</body>
</html>
