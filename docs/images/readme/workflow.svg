<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="t d">
  <title id="t">三步上手：选择安装包、准备运行时、打开应用</title>
  <desc id="d">纯黑底三栏说明，栏间以细线分隔：01 选择安装包，02 准备运行时，03 打开应用。</desc>

  <rect width="1200" height="272" fill="#0B0C0D"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, system-ui, sans-serif">
    <text x="48" y="44" fill="#767E87" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="2.4">QUICK START</text>
    <text x="1152" y="44" text-anchor="end" fill="#5C646C" font-family="Cascadia Mono, Consolas, monospace" font-size="9" letter-spacing="1.2">FROM FILE TO WINDOW</text>
    <path d="M48 60h1104" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>

    <!-- 01 -->
    <g transform="translate(48 0)">
      <g transform="translate(0 92)" fill="none" stroke="#F2F4F5" stroke-width="1.5" stroke-linejoin="round">
        <path d="M1 4h16l13 13v23H1z"/>
        <path d="M17 4v13h13" stroke-opacity=".55"/>
      </g>
      <text x="328" y="104" text-anchor="end" fill="#8FB6D0" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" letter-spacing="1.6">01</text>
      <text x="0" y="160" fill="#F2F4F5" font-size="21" font-weight="700">选择安装包</text>
      <text x="0" y="190" fill="#A7AEB6" font-size="12.5">单文件 <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="11.5">.apk</tspan> 直接安装；</text>
      <text x="0" y="209" fill="#A7AEB6" font-size="12.5"><tspan font-family="Cascadia Mono, Consolas, monospace" font-size="11.5">.apks</tspan> 与 <tspan font-family="Cascadia Mono, Consolas, monospace" font-size="11.5">.xapk</tspan> 的分片一起装上。</text>
      <text x="0" y="232" fill="#767E87" font-size="11">文件关联开启后可从资源管理器双击。</text>
    </g>

    <path d="M408 84v168" stroke="#FFFFFF" stroke-opacity=".1"/>

    <!-- 02 -->
    <g transform="translate(424 0)">
      <g transform="translate(0 92)" fill="none" stroke="#F2F4F5" stroke-width="1.5" stroke-linejoin="round">
        <path d="M16 2 30 9 16 16 2 9z"/>
        <path d="M2 16 16 23 30 16" stroke-opacity=".7"/>
        <path d="M2 23 16 30 30 23" stroke-opacity=".4"/>
      </g>
      <text x="328" y="104" text-anchor="end" fill="#8FB6D0" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" letter-spacing="1.6">02</text>
      <text x="0" y="160" fill="#F2F4F5" font-size="21" font-weight="700">准备运行时</text>
      <text x="0" y="190" fill="#A7AEB6" font-size="12.5">首次联网部署 Emulator、ADB</text>
      <text x="0" y="209" fill="#A7AEB6" font-size="12.5">与系统镜像，之后就绪即用。</text>
      <text x="0" y="232" fill="#767E87" font-size="11">约需 3 GB 空间与可用的硬件加速。</text>
    </g>

    <path d="M784 84v168" stroke="#FFFFFF" stroke-opacity=".1"/>

    <!-- 03 -->
    <g transform="translate(800 0)">
      <g transform="translate(0 92)" fill="none" stroke="#F2F4F5" stroke-width="1.5" stroke-linejoin="round">
        <rect x="1" y="3" width="30" height="21"/>
        <path d="M1 10h30" stroke-opacity=".55"/>
        <path d="M10 24v5h12v-5" stroke-opacity=".7"/>
      </g>
      <text x="328" y="104" text-anchor="end" fill="#8FB6D0" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" letter-spacing="1.6">03</text>
      <text x="0" y="160" fill="#F2F4F5" font-size="21" font-weight="700">打开应用</text>
      <text x="0" y="190" fill="#A7AEB6" font-size="12.5">桌面与开始菜单留下入口，</text>
      <text x="0" y="209" fill="#A7AEB6" font-size="12.5">应用在独立窗口里运行。</text>
      <text x="0" y="232" fill="#767E87" font-size="11">可在设置里改为嵌入窗口。</text>
    </g>
  </g>
</svg>
