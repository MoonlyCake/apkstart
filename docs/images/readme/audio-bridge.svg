<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="t d">
  <title id="t">Windows 与 Android 的双向音频路由</title>
  <desc id="d">线路图：Windows 的麦克风经音频策略送入安卓应用录音；安卓的媒体音轨经音频策略回到 Windows 耳机或扬声器。麦克风默认关闭。</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="352"/></clipPath>
    <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1l6.5 4-6.5 4" fill="none" stroke="#8FB6D0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1l6.5 4-6.5 4" fill="none" stroke="#F2F4F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="352" fill="#0B0C0D"/>

    <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, system-ui, sans-serif">
      <text x="48" y="46" fill="#6A727B" font-size="9.5" font-weight="700" letter-spacing="2.2">AUDIO BRIDGE</text>
      <text x="1152" y="46" text-anchor="end" fill="#5C646C" font-family="Cascadia Mono, Consolas, monospace" font-size="9" letter-spacing="1">WINDOWS / ANDROID</text>
      <path d="M48 60h1104" stroke="#22262A" stroke-width="1"/>

      <!-- 左：Windows -->
      <rect x="48.5" y="88.5" width="252" height="208" fill="#141719" fill-opacity=".6" stroke="#282D32"/>
      <text x="70" y="116" fill="#6A727B" font-size="9.5" font-weight="700" letter-spacing="2">WINDOWS 主机</text>
      <path d="M70 128h210" stroke="#1E2226"/>

      <g fill="none" stroke="#F2F4F5" stroke-width="1.4" stroke-linecap="round">
        <rect x="76" y="158" width="7" height="14"/>
        <path d="M71 167v1a8.5 8.5 0 0 0 17 0v-1M79.5 176v3M75 183h9"/>
      </g>
      <text x="104" y="165" fill="#F2F4F5" font-size="13" font-weight="600">麦克风</text>
      <text x="104" y="181" fill="#767E87" font-size="11">Windows 默认输入设备</text>

      <g fill="none" stroke="#F2F4F5" stroke-width="1.4" stroke-linejoin="round">
        <path d="M72 238v4h4l7 5v-18l-7 5h-4z"/>
        <path d="M89 231a12 12 0 0 1 0 14" stroke-linecap="round"/>
        <path d="M94 227a19 19 0 0 1 0 22" stroke-linecap="round" opacity=".4"/>
      </g>
      <text x="104" y="245" fill="#F2F4F5" font-size="13" font-weight="600">耳机 / 扬声器</text>
      <text x="104" y="261" fill="#767E87" font-size="11">Windows 默认输出设备</text>

      <!-- 右：Android -->
      <rect x="899.5" y="88.5" width="252" height="208" fill="#141719" fill-opacity=".6" stroke="#282D32"/>
      <text x="921" y="116" fill="#6A727B" font-size="9.5" font-weight="700" letter-spacing="2">ANDROID 应用</text>
      <path d="M921 128h210" stroke="#1E2226"/>

      <circle cx="932" cy="168" r="6.5" fill="none" stroke="#8FB6D0" stroke-width="1.4"/>
      <circle cx="932" cy="168" r="2.6" fill="#8FB6D0"/>
      <text x="950" y="165" fill="#F2F4F5" font-size="13" font-weight="600">录音</text>
      <text x="950" y="181" fill="#767E87" font-size="11">应用需自行获得麦克风权限</text>

      <g stroke="#F2F4F5" stroke-width="2" stroke-linecap="round" opacity=".8">
        <path d="M928 248v-8M934 252v-16M940 250v-12M946 254v-20M952 246v-6"/>
      </g>
      <text x="968" y="245" fill="#F2F4F5" font-size="13" font-weight="600">播放</text>
      <text x="968" y="261" fill="#767E87" font-size="11">媒体音轨随输出设备播放</text>

      <!-- 采集：Windows → 安卓 -->
      <path d="M300 168h72" stroke="#8FB6D0" stroke-width="1.5"/>
      <path d="M470 168h64" stroke="#8FB6D0" stroke-width="1.5" marker-end="url(#ag)"/>
      <text x="312" y="157" fill="#8FB6D0" font-size="10.5" font-weight="600" letter-spacing=".6">采集</text>

      <g transform="translate(372 156)">
        <rect width="98" height="24" fill="#171B21" stroke="#282D32"/>
        <circle cx="14" cy="12" r="3.2" fill="#5C646C"/>
        <rect x="20" y="10.6" width="13" height="2.8" fill="#D6DCD6"/>
        <text x="41" y="15.6" fill="#8A929B" font-size="9.5" font-weight="600">默认关闭</text>
      </g>

      <!-- 中间：策略 -->
      <rect x="533.5" y="128.5" width="133" height="128" fill="#141719" stroke="#282D32"/>
      <text x="600" y="152" text-anchor="middle" fill="#F2F4F5" font-size="11.5" font-weight="700">音频策略</text>
      <text x="600" y="168" text-anchor="middle" fill="#767E87" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5">audio-policy.js</text>
      <path d="M553 182h94" stroke="#1E2226"/>
      <text x="553" y="202" fill="#C3C9CF" font-family="Cascadia Mono, Consolas, monospace" font-size="9">hw.audioInput</text>
      <text x="553" y="222" fill="#C3C9CF" font-family="Cascadia Mono, Consolas, monospace" font-size="9">hw.audioOutput</text>
      <text x="553" y="242" fill="#6A727B" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5">-allow-host-audio</text>

      <!-- 送入：策略 → 安卓 -->
      <path d="M666 168h234" stroke="#8FB6D0" stroke-width="1.5" marker-end="url(#ag)"/>
      <text x="748" y="157" fill="#8FB6D0" font-size="10.5" font-weight="600" letter-spacing=".6">送入录音</text>

      <!-- 播放：安卓 → Windows -->
      <path d="M900 248H666" stroke="#F2F4F5" stroke-width="1.5" marker-end="url(#ak)"/>
      <path d="M534 248H300" stroke="#F2F4F5" stroke-width="1.5" marker-end="url(#ak)"/>
      <text x="748" y="237" fill="#C3C9CF" font-size="10.5" font-weight="600" letter-spacing=".6">媒体音轨</text>
      <text x="312" y="237" fill="#C3C9CF" font-size="10.5" font-weight="600" letter-spacing=".6">播放</text>

      <!-- 底部说明 -->
      <g font-size="11" fill="#8A929B">
        <circle cx="52" cy="325" r="2.6" fill="#8FB6D0"/>
        <text x="64" y="329">输入与输出各自开关</text>
        <circle cx="212" cy="325" r="2.6" fill="#8FB6D0"/>
        <text x="224" y="329">配置变更会跳过快照，但不清除应用数据</text>
        <circle cx="508" cy="325" r="2.6" fill="#8FB6D0"/>
        <text x="520" y="329">是音频转发，不是 USB 直通</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="351" fill="none" stroke="#282D32"/>
  </g>
</svg>
