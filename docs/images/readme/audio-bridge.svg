<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-labelledby="title desc">
  <title id="title">Apk Start --Q · Two-way audio</title>
  <desc id="desc">Windows 默认麦克风将声音送进安卓应用；安卓应用将播放声音送回 Windows 默认输出。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15132A"/>
      <stop offset=".53" stop-color="#141B34"/>
      <stop offset="1" stop-color="#102937"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2B2447"/>
      <stop offset="1" stop-color="#1B3E4A"/>
    </linearGradient>
    <linearGradient id="mic" gradientUnits="userSpaceOnUse" x1="285" y1="0" x2="915" y2="0">
      <stop stop-color="#B195F8"/>
      <stop offset="1" stop-color="#E4BAFF"/>
    </linearGradient>
    <linearGradient id="play" gradientUnits="userSpaceOnUse" x1="285" y1="0" x2="915" y2="0">
      <stop stop-color="#A4FFF1"/>
      <stop offset="1" stop-color="#57CBBF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#8064BF" stop-opacity=".31"/>
      <stop offset="1" stop-color="#8064BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".85" fill="#9BA7D3" opacity=".25"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="356" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Segoe UI, system-ui, sans-serif">
    <rect width="1200" height="356" fill="url(#surface)"/>
    <ellipse cx="893" cy="33" rx="410" ry="204" fill="url(#halo)"/>
    <path d="M675 0h525v356H423Z" fill="url(#dots)"/>
    <g fill="none" stroke="#818BB0" stroke-opacity=".16">
      <circle cx="1116" cy="36" r="116"/>
      <circle cx="1116" cy="36" r="143"/>
      <circle cx="1116" cy="36" r="172"/>
    </g>
    <rect x=".65" y=".65" width="1198.7" height="354.7" rx="27.35" fill="none" stroke="#8195BD" stroke-opacity=".44" stroke-width="1.3"/>

    <circle cx="64" cy="49" r="4" fill="#DBC0FF"/>
    <text x="80" y="54" fill="#CDB5ED" font-size="14" font-weight="700" letter-spacing="2.7">THE SIGNAL BRIDGE</text>
    <text x="1144" y="54" text-anchor="end" fill="#D1C8EA" font-size="13" font-weight="650" letter-spacing="1.8">APK START --Q / AUDIO</text>
    <text x="55" y="121" fill="#F5F4FF" font-size="58" font-weight="750" letter-spacing="-1.8">Two-way audio.</text>
    <path d="M972 109h18l8-13 10 29 12-46 11 35 9-10h104" fill="none" stroke="#88EDDE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>

    <g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M286 198h124m380 0h124m-536-6 6 6-6 6m504-12 6 6-6 6" stroke="url(#mic)"/>
      <path d="M410 258H286m628 0H790m-460-6-6 6 6 6m504-12-6 6 6 6" stroke="url(#play)"/>
    </g>
    <text x="348" y="184" text-anchor="middle" fill="#E9CCFF" font-size="14" font-weight="700" letter-spacing="1.4">MIC IN</text>
    <text x="852" y="281" text-anchor="middle" fill="#9AF5E7" font-size="14" font-weight="700" letter-spacing="1.25">AUDIO OUT</text>

    <g transform="translate(56 164)">
      <rect width="230" height="126" rx="20" fill="#24243F" stroke="#595276"/>
      <rect x="22" y="20" width="40" height="40" rx="12" fill="#42365B"/>
      <g fill="none" stroke="#E7C8FF" stroke-width="1.7" stroke-linecap="round">
        <rect x="38" y="29" width="8" height="15" rx="4"/>
        <path d="M34 41v2a8 8 0 0 0 16 0v-2m-8 10v4m-4 0h8"/>
      </g>
      <text x="76" y="48" fill="#F5EDFF" font-size="28" font-weight="700">Windows</text>
      <text x="23" y="91" fill="#D4C7E8" font-size="14" font-weight="600" letter-spacing=".8">MIC + HEADPHONES</text>
    </g>

    <g transform="translate(410 164)">
      <rect width="380" height="126" rx="20" fill="url(#bridge)" stroke="#657B9B"/>
      <path d="M0 63h380" stroke="#9CA9C2" stroke-opacity=".2"/>
      <g transform="translate(27 34)" fill="none" stroke="#E6C6FF" stroke-width="2.1" stroke-linecap="round">
        <path d="M0 0h11l5-7 6 15 7-19 6 11h12"/>
      </g>
      <g transform="translate(74 94)" fill="none" stroke="#A1FBEC" stroke-width="2.1" stroke-linecap="round">
        <path d="M0 0h-11l-5 7-6-15-7 19-6-11h-12"/>
      </g>
      <text x="94" y="40" fill="#F1D8FF" font-size="17" font-weight="650">Microphone capture</text>
      <text x="94" y="100" fill="#A9F6EC" font-size="17" font-weight="650">Independent playback</text>
      <circle cx="352" cy="34" r="4" fill="#E4BAFF"/>
      <circle cx="352" cy="94" r="4" fill="#7AE8D9"/>
    </g>

    <g transform="translate(914 164)">
      <rect width="230" height="126" rx="20" fill="#1C3542" stroke="#496F77"/>
      <rect x="22" y="20" width="40" height="40" rx="12" fill="#2B5058"/>
      <g fill="none" stroke="#A4FFF1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="35" y="28" width="14" height="24" rx="3"/>
        <path d="M40 48h4"/>
      </g>
      <text x="76" y="48" fill="#E7FFF8" font-size="28" font-weight="700">Android</text>
      <text x="23" y="91" fill="#BEEDE6" font-size="14" font-weight="600" letter-spacing=".8">RECORD + PLAY</text>
    </g>

    <path d="M57 313h1086" stroke="#8492B4" stroke-opacity=".3"/>
    <circle cx="63" cy="333" r="3" fill="#D8B7FF"/>
    <text x="75" y="338" fill="#D7C6EA" font-size="12" font-weight="650" letter-spacing="1.5">OPT-IN CAPTURE</text>
    <circle cx="261" cy="333" r="3" fill="#91F3E4"/>
    <text x="273" y="338" fill="#C6EEEA" font-size="12" font-weight="650" letter-spacing="1.5">WINDOWS OUTPUT</text>
  </g>
</svg>
