<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ApkStart by MoonlyCake</title>
  <desc id="desc">A midnight-blue poster with an illustrated desktop library and a floating Android app window. Android apps, at home on Windows.</desc>
  <defs>
