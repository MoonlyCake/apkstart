83 -55.0Q782.6 -56.2 781.8 -58.2Q781.1 -60.1 780.2 -62.6Q779.4 -65.1 778.6 -67.6Q777.8 -70.1 777 -72.1H776.0Q775.1 -69.6 774 -66.4Q772.8 -63.2 771.7 -60.1Q770.6 -57.1 769.8 -55.0Z M857.5 0.0V-100.2H944.3Q955.6 -100.2 963.1 -95.6Q970.6 -90.9 974.4 -83.3Q978.2 -75.7 978.2 -67.0Q978.2 -56.9 973.7 -49.1Q969.3 -41.3 960.7 -36.7L980.5 0.0H939.8L924.7 -31.3H893.5V0.0ZM893.5 -56.2H931.7Q935.7 -56.2 938.5 -58.8Q941.3 -61.3 941.3 -65.8Q941.3 -68.9 940 -71.0Q938.7 -73.1 936.6 -74.2Q934.4 -75.3 931.7 -75.3H893.5Z M1030 0.0V-72.7H987.5V-100.2H1108.6V-72.7H1066.0V0.0Z" transform="translate(40 240)" fill="#FFFFFF"/>

  <path d="M40 286h1120" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="1"/>

  <!-- 左栏：主张与规格 -->
  <text x="40" y="332" font-family="Cascadia Mono, Consolas, monospace" font-size="10" letter-spacing="2.2" fill="#6B737C">01 / 它是什么</text>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#E7EAEC" font-size="20.5">
    <text x="40" y="374">拖入 APK，双击桌面图标，</text>
    <text x="40" y="404">它就在独立窗口里运行。</text>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" fill="#7E868F" font-size="12.5">
    <text x="40" y="446">默认使用 Android 14 运行时，</text>
    <text x="40" y="466">不必另装模拟器，不会擅自清除应用数据。</text>
  </g>

  <g font-family="Cascadia Mono, Consolas, monospace">
    <text x="40" y="514" font-size="10" letter-spacing="2.2" fill="#6B737C">SPEC</text>
    <g font-size="12">
      <text x="40" y="544" fill="#7B828B">系统镜像</text>
      <text x="470" y="544" text-anchor="end" font-size="11.5" fill="#C7CED5">ANDROID 14 / GOOGLE PLAY</text>
      <path d="M40 554h430" stroke="#FFFFFF" stroke-opacity=".09"/>
      <text x="40" y="574" fill="#7B828B">音频</text>
      <text x="470" y="574" text-anchor="end" font-size="11.5" fill="#C7CED5">播放默认开启 / 麦克风默认关闭</text>
      <path d="M40 584h430" stroke="#FFFFFF" stroke-opacity=".09"/>
      <text x="40" y="604" fill="#7B828B">窗口</text>
      <text x="470" y="604" text-anchor="end" font-size="11.5" fill="#C7CED5">原生 / 嵌入</text>
    </g>
  </g>

  <!-- 中栏：三步 -->
  <text x="530" y="332" font-family="Cascadia Mono, Consolas, monospace" font-size="10" letter-spacing="2.2" fill="#6B737C">02 / 三步</text>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="530" y="384" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" fill="#8FB6D0">01</text>
    <text x="556" y="384" font-size="14" fill="#E7EAEC">拖入安装包</text>
    <text x="556" y="404" font-size="11.5" fill="#6F777F">.apk / .apks / .xapk</text>
    <path d="M530 420h240" stroke="#FFFFFF" stroke-opacity=".09"/>

    <text x="530" y="458" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" fill="#8FB6D0">02</text>
    <text x="556" y="458" font-size="14" fill="#E7EAEC">准备运行时</text>
    <text x="556" y="478" font-size="11.5" fill="#6F777F">首次部署，之后按需复用</text>
    <path d="M530 494h240" stroke="#FFFFFF" stroke-opacity=".09"/>

    <text x="530" y="532" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" fill="#8FB6D0">03</text>
    <text x="556" y="532" font-size="14" fill="#E7EAEC">双击图标</text>
    <text x="556" y="552" font-size="11.5" fill="#6F777F">独立窗口，可固定到任务栏</text>
    <path d="M530 568h240" stroke="#FFFFFF" stroke-opacity=".09"/>
  </g>

  <!-- 右栏：冷蓝图版 -->
  <g clip-path="url(#plateClip)">
    <rect x="800" y="308" width="356" height="232" fill="url(#sky)"/>
    <g stroke="#EAF3F8" stroke-opacity=".22" stroke-width="1">
      <path d="M800 496 1156 336"/>
      <path d="M800 520 1156 360"/>
      <path d="M800 544 1100 412"/>
    </g>
    <rect x="800" y="308" width="356" height="232" fill="url(#veil)"/>
    <rect x="800" y="308" width="356" height="232" filter="url(#grain)" opacity=".10"/>
    <g transform="translate(924 396)">
      <rect width="52" height="52" fill="#FFFFFF"/>
      <path d="M20 15 38 26 20 37z" fill="#0B0C0D"/>
    </g>
  </g>
  <rect x="800" y="308" width="356" height="232" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#6F777F">
    <text x="800" y="566">贴一张桌面快捷方式，</text>
    <text x="800" y="584">图标由安装包里的资源生成。</text>
  </g>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#565D65">
    <text x="800" y="620">ICON EXTRACTED FROM PACKAGE</text>
  </g>

  <!-- 页脚 -->
  <path d="M40 640h1120" stroke="#FFFFFF" stroke-opacity=".16"/>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="10" letter-spacing="1.8" fill="#565D65">
    <text x="40" y="662">MAINTAINED BY MOONLYCAKE</text>
    <text x="1160" y="662" text-anchor="end">DOUBLE-CLICK TO LAUNCH</text>
  </g>
</svg>
