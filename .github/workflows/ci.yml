name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Windows / Node ${{ matrix.node }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 单元测试不需要 Electron 二进制，跳过 188MB 下载以加快 CI
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行测试
        run: npm test

      # 直接驱动 agent.ps1 内嵌 C# 的钩子回调，防止键位映射被改坏
      - name: 鼠标钩子逻辑冒烟测试
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }

  ui:
    name: 窗口与设置回归（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Electron 设置及启动画面（静音、独立配置）
        shell: pwsh
        run: |
          $electron = (Resolve-Path 'node_modules/electron/dist/electron.exe').Path
          foreach ($test in 'settings-ui-test', 'splash-ui-test') {
            $base = Join-Path $env:RUNNER_TEMP "apkstart-$test"
            $argsList = @("test/$test.js", "--user-data-dir=`"$base`"", '--mute-audio')
            $proc = Start-Process -FilePath $electron -ArgumentList $argsList -WindowStyle Hidden -Wait -PassThru `
              -RedirectStandardOutput "$base.stdout" -RedirectStandardError "$base.stderr"
            Get-Content -LiteralPath "$base.stdout", "$base.stderr"
            if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          }
